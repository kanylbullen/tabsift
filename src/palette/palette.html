<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabsift</title>
    <link rel="stylesheet" href="palette.css" />
  </head>
  <body>
    <header>
      <input
        id="query"
        type="text"
        autocomplete="off"
        spellcheck="false"
        data-i18n-placeholder="search_placeholder"
        data-i18n-aria-label="search_placeholder"
      />
      <div id="counts" class="counts"></div>
    </header>

    <main>
      <ul id="results" class="results" role="listbox" data-i18n-aria-label="tabs_list_label"></ul>
      <div id="empty" class="empty" hidden></div>
    </main>

    <div id="notice" class="notice" hidden></div>

    <footer>
      <button id="btn-dedupe" type="button" class="action"></button>
      <button id="btn-group" type="button" class="action"></button>
      <button id="btn-stale" type="button" class="action"></button>
      <button id="btn-undo" type="button" class="action ghost" hidden data-i18n="btn_undo"></button>
      <span class="spacer"></span>
      <button id="btn-options" type="button" class="action ghost" data-i18n-title="btn_settings">⚙</button>
    </footer>

    <script type="module" src="palette.js"></script>
  </body>
</html>
