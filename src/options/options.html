<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabsift — settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Tabsift</h1>
    <p class="lede" data-i18n="opt_lede"></p>

    <section>
      <h2 data-i18n="opt_perm_h"></h2>
      <p data-i18n="opt_perm_p"></p>
    </section>

    <section>
      <h2 data-i18n="opt_ai_h"></h2>
      <label class="field">
        <span data-i18n="opt_provider"></span>
        <select id="provider">
          <option value="none" data-i18n="opt_provider_none"></option>
          <option value="ollama" data-i18n="opt_provider_ollama"></option>
          <option value="edge" data-i18n="opt_provider_edge"></option>
          <option value="openai" data-i18n="opt_provider_openai"></option>
          <option value="anthropic" data-i18n="opt_provider_anthropic"></option>
        </select>
      </label>

      <div class="panel" data-provider="ollama" hidden>
        <label class="field">
          <span data-i18n="opt_base_url"></span>
          <input id="ollama-url" type="url" placeholder="http://localhost:11434" />
        </label>
        <label class="field">
          <span data-i18n="opt_model"></span>
          <input id="ollama-model" type="text" placeholder="llama3.2" list="ollama-models" />
          <datalist id="ollama-models"></datalist>
        </label>
        <p class="hint">
          <span data-i18n="opt_ollama_hint"></span>
          <code id="ollama-origin-hint">OLLAMA_ORIGINS='chrome-extension://…'</code>
        </p>
      </div>

      <div class="panel" data-provider="openai" hidden>
        <label class="field">
          <span data-i18n="opt_base_url"></span>
          <input id="openai-url" type="url" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span data-i18n="opt_model"></span>
          <input id="openai-model" type="text" placeholder="gpt-4o-mini" />
        </label>
        <label class="field">
          <span data-i18n="opt_api_key"></span>
          <input id="openai-key" type="password" autocomplete="off" placeholder="sk-…" />
        </label>
        <p class="hint" data-i18n="opt_openai_hint"></p>
      </div>

      <div class="panel" data-provider="anthropic" hidden>
        <label class="field">
          <span data-i18n="opt_model"></span>
          <select id="anthropic-model"></select>
        </label>
        <label class="field">
          <span data-i18n="opt_api_key"></span>
          <input id="anthropic-key" type="password" autocomplete="off" placeholder="sk-ant-…" />
        </label>
        <p class="hint warn" data-i18n="opt_anthropic_hint"></p>
      </div>

      <div class="panel" data-provider="edge" hidden>
        <p class="hint" data-i18n="opt_edge_hint"></p>
        <p id="edge-status" class="status"></p>
      </div>

      <div class="row" id="ai-actions" hidden>
        <button id="btn-permission" type="button" data-i18n="opt_grant"></button>
        <button id="btn-test" type="button" data-i18n="opt_test"></button>
        <span id="test-status" class="status"></span>
      </div>
    </section>

    <section>
      <h2 data-i18n="opt_dedupe_h"></h2>
      <label class="check"><input type="checkbox" id="d-hash" /> <span data-i18n="opt_d_hash"></span></label>
      <label class="check"><input type="checkbox" id="d-tracking" /> <span data-i18n="opt_d_tracking"></span></label>
      <label class="check"><input type="checkbox" id="d-slash" /> <span data-i18n="opt_d_slash"></span></label>
      <label class="check"><input type="checkbox" id="d-newtab" /> <span data-i18n="opt_d_newtab"></span></label>
      <label class="check"><input type="checkbox" id="d-windows" /> <span data-i18n="opt_all_windows"></span></label>
      <p class="hint" data-i18n="opt_dedupe_hint"></p>
    </section>

    <section>
      <h2 data-i18n="opt_stale_h"></h2>
      <label class="field">
        <span data-i18n="opt_s_days"></span>
        <input id="s-days" type="number" min="0.01" max="365" step="any" />
      </label>
      <label class="check"><input type="checkbox" id="s-grouped" /> <span data-i18n="opt_s_grouped"></span></label>
      <label class="check"><input type="checkbox" id="s-windows" /> <span data-i18n="opt_all_windows"></span></label>
      <p class="hint" data-i18n="opt_stale_hint"></p>
    </section>

    <section>
      <h2 data-i18n="opt_group_h"></h2>
      <label class="check"><input type="checkbox" id="g-rules" /> <span data-i18n="opt_g_rules"></span></label>
      <label class="check"><input type="checkbox" id="g-ungrouped" /> <span data-i18n="opt_g_ungrouped"></span></label>
      <label class="check"><input type="checkbox" id="g-collapse" /> <span data-i18n="opt_g_collapse"></span></label>
      <label class="check"><input type="checkbox" id="g-windows" /> <span data-i18n="opt_g_windows"></span></label>
      <label class="field">
        <span data-i18n="opt_g_max"></span>
        <input id="g-max" type="number" min="10" max="300" step="10" />
      </label>
    </section>

    <section>
      <h2 data-i18n="opt_keys_h"></h2>
      <p data-i18n="opt_keys_p"></p>
      <button id="btn-shortcuts" type="button" data-i18n="opt_keys_btn"></button>
    </section>

    <footer id="saved" class="saved" hidden data-i18n="opt_saved"></footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
